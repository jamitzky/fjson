[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fjson"
version = "0.3.0"
description = "A small pure-Python FJ@ JSON interpreter"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}

[tool.setuptools.packages.find]
include = ["fjson*"]
